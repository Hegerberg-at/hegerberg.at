[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Bun as the build runtime on Netlify.
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"

# Decap CMS: Netlify Identity + Git Gateway have to be enabled in the Netlify
# dashboard under "Site configuration → Identity".
#   1. enable Identity
#   2. Registration: set "Invite only"
#   3. Services → enable Git Gateway
#   4. invite editors through "Invite users"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
