[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Bun als Build-Runtime auf Netlify.
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"

# Decap CMS: Netlify Identity + Git Gateway müssen im Netlify-Dashboard
# unter "Site configuration → Identity" aktiviert werden.
#   1. Identity aktivieren
#   2. Registration: "Invite only" setzen
#   3. Services → Git Gateway aktivieren
#   4. Redakteur:innen per "Invite users" einladen

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
