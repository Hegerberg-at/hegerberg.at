#
# Local development:
#   just                  starts the dev server and the CMS proxy together
#   Browser:              http://localhost:4321/admin/
# Alternatively by hand: `bun run dev` and `bun run cms` in two terminals.
# With `local_backend: true` this writes straight to the file system –
# no git authentication involved.
#
# The labels, hints and descriptions below are the editor-facing UI and stay
# in German; only the technical field names are English.

backend:
  name: github
  repo: Hegerberg-at/hegerberg.at
  # OAuth proxy on the same domain (public/oauth/index.php). Only the login
  # goes through it – saving happens directly via the GitHub API in the browser.
  base_url: https://hegerberg.at
  auth_endpoint: oauth/

  branch: main
  commit_messages:
    create: 'CMS: {{collection}} „{{slug}}“ angelegt'
    update: 'CMS: {{collection}} „{{slug}}“ aktualisiert'
    delete: 'CMS: {{collection}} „{{slug}}“ gelöscht'
    uploadMedia: 'CMS: Medium {{path}} hochgeladen'
    deleteMedia: 'CMS: Medium {{path}} gelöscht'

# Local backend for development (ignored in production).
local_backend: true

locale: de
site_url: https://hegerberg.at
display_url: https://hegerberg.at

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------------------------------------------------------------------- Home
  - name: home
    label: Startseite
    description: Die Texte der Willkommens-Seite. Speisen, Veranstaltungen und
      Öffnungszeiten werden aus den jeweiligen Bereichen übernommen.
    files:
      - name: index
        label: Startseite
        file: src/content/home/index.md
        format: yaml-frontmatter
        preview: false
        fields:
          - name: hero
            label: Titelbild-Bereich
            widget: object
            fields:
              - name: image
                label: Titelbild
                widget: image
                required: false
                choose_url: false
                hint: Breites Querformat, mindestens 2000 px. Ohne Angabe wird das
                  Standard-Panorama verwendet.
              - name: title
                label: Große Überschrift
                widget: string
                required: false
                hint: Ohne Angabe wird „Schutzhaus am Hegerberg“ verwendet.
              - name: subtitle
                label: Untertitel
                widget: text
                required: false
          - name: welcome
            label: Begrüßung
            widget: object
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: title, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: specialties
            label: 'Abschnitt „Hausspezialitäten“'
            widget: object
            hint: Welche Speisen erscheinen, wird in der Speisekarte über
              „Hausspezialität“ festgelegt.
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: title, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: events
            label: 'Abschnitt „Veranstaltungen“'
            widget: object
            hint: Zeigt automatisch die drei nächsten Veranstaltungen.
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: title, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: cta
            label: Abschluss-Box
            widget: object
            hint: Adresse und Telefonnummer werden automatisch ergänzt.
            fields:
              - { name: title, label: Überschrift, widget: string }

  # ---------------------------------------------------------------------- Menu
  - name: menu
    label: Speisekarte
    label_singular: Speise
    description: Alle Speisen und Getränke der Karte.
    folder: src/content/menu
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{category}} · {{name}} ({{price}} €)'
    sortable_fields: [category, order, name, price]
    view_groups:
      - label: Kategorie
        field: category
    fields:
      - { name: name, label: Bezeichnung, widget: string }
      - name: category
        label: Kategorie
        widget: select
        options: [Suppen, Vorspeisen, Hauptspeisen, Desserts, Getränke]
        default: Hauptspeisen
      - name: description
        label: Beschreibung
        widget: text
        required: false
        hint: Kurzer Beschreibungstext, der unter der Bezeichnung erscheint.
      - name: price
        label: Preis in Euro
        widget: number
        value_type: float
        min: 0
        step: 0.1
        hint: Punkt als Dezimaltrennzeichen, z. B. 16.5
      - name: allergens
        label: Allergene
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - { label: 'A – Glutenhaltiges Getreide', value: A }
          - { label: 'B – Krebstiere', value: B }
          - { label: 'C – Eier', value: C }
          - { label: 'D – Fisch', value: D }
          - { label: 'E – Erdnüsse', value: E }
          - { label: 'F – Soja', value: F }
          - { label: 'G – Milch und Laktose', value: G }
          - { label: 'H – Schalenfrüchte (Nüsse)', value: H }
          - { label: 'L – Sellerie', value: L }
          - { label: 'M – Senf', value: M }
          - { label: 'N – Sesam', value: N }
          - { label: 'O – Sulfite', value: O }
          - { label: 'P – Lupinen', value: P }
          - { label: 'R – Weichtiere', value: R }
      - name: available
        label: Aktuell verfügbar
        widget: boolean
        default: true
        hint: Deaktivieren, statt die Speise zu löschen – sie wird dann ausgegraut dargestellt.
      - name: houseSpecialty
        label: Hausspezialität
        widget: boolean
        default: false
        hint: Wird zusätzlich auf der Startseite hervorgehoben.
      - name: order
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter oben innerhalb der Kategorie.

  # ------------------------------------------------------------- Opening hours
  - name: openingHours
    label: Öffnungszeiten
    label_singular: Wochentag
    description: Je ein Eintrag pro Wochentag. Bitte keine Tage anlegen oder löschen.
    folder: src/content/opening-hours
    create: false
    delete: false
    format: yaml-frontmatter
    identifier_field: day
    summary: '{{order}} · {{day}}'
    sortable_fields: [order]
    fields:
      - name: day
        label: Wochentag
        widget: select
        options:
          [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag]
      - name: order
        label: Position (Mo = 1 … So = 7)
        widget: number
        value_type: int
        min: 1
        max: 7
      - name: closed
        label: Ruhetag / geschlossen
        widget: boolean
        default: false
      - name: from
        label: Geöffnet ab
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 11:00. An einem Ruhetag wird die Zeit ignoriert
          und muss nicht gelöscht werden.'
      - name: until
        label: Geöffnet bis
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 22:00. An einem Ruhetag wird die Zeit ignoriert
          und muss nicht gelöscht werden.'
      - name: note
        label: Hinweis
        widget: string
        required: false
        hint: 'z. B. „Ruhetag“ oder „Bei Schlechtwetter geschlossen“.'

  # ------------------------------------------------------------------- History
  - name: history
    label: Geschichte
    label_singular: Kapitel
    description: Die Kapitel auf der Seite „Geschichte“.
    folder: src/content/history
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{year}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Titel, widget: string }
      - name: year
        label: Jahr / Zeitraum
        widget: string
        required: false
        hint: 'z. B. „1928“, „1950er“ oder „Heute“.'
      - name: description
        label: Kurzbeschreibung
        widget: text
        hint: Einleitender Satz, der als Vorspann angezeigt wird.
      - name: image
        label: Bild
        widget: image
        required: false
        choose_url: false
      - name: imageAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
        hint: Wichtig für Barrierefreiheit und Suchmaschinen.
      - name: order
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
      - name: body
        label: Fließtext
        widget: markdown
        required: false

  # ------------------------------------------------------------------- Gallery
  - name: gallery
    label: Galerie
    label_singular: Foto
    description: Fotos für die Galerie-Seite. Ein Eintrag = ein Bild.
    folder: src/content/gallery
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{order}} · {{title}} ({{category}})'
    sortable_fields: [order, title, category]
    view_groups:
      - label: Kategorie
        field: category
    fields:
      - name: title
        label: Titel
        widget: string
        hint: Wird über dem Bild und in der Großansicht angezeigt.
      - name: image
        label: Foto
        widget: image
        choose_url: false
        media_library:
          config:
            max_file_size: 5000000
        hint: Querformat funktioniert am besten. Bitte vorher auf max. 2000 px Breite verkleinern.
      - name: imageAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
        hint: Kurze Beschreibung für Screenreader. Ohne Angabe wird der Titel verwendet.
      - name: description
        label: Bildunterschrift
        widget: text
        required: false
        hint: Erscheint in der Großansicht unter dem Foto.
      - name: category
        label: Kategorie
        widget: select
        default: Haus & Terrasse
        options:
          - Haus & Terrasse
          - Küche
          - Aussicht
          - Veranstaltungen
      - name: highlight
        label: Groß darstellen
        widget: boolean
        default: false
        hint: Das Foto belegt im Raster die doppelte Fläche.
      - name: order
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter vorne.

  # -------------------------------------------------------------------- Events
  - name: events
    label: Veranstaltungen
    label_singular: Veranstaltung
    description: Feste, Konzerte und geführte Wanderungen.
    folder: src/content/events
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titel, widget: string }
      - name: date
        label: Datum
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        format: YYYY-MM-DD
      - name: endDate
        label: Enddatum (bei mehrtägigen Veranstaltungen)
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        format: YYYY-MM-DD
      - name: time
        label: Beginn (Uhrzeit)
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 17:00'
      - name: description
        label: Kurzbeschreibung
        widget: text
        hint: Wird in der Vorschaukachel und als Vorspann auf der Detailseite angezeigt.
      - name: image
        label: Bild
        widget: image
        required: false
        choose_url: false
      - name: imageAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
      - name: cancelled
        label: Abgesagt
        widget: boolean
        default: false
      - name: body
        label: Weitere Details
        widget: markdown
        required: false
        hint: Ausführlicher Text – erscheint nur auf der Detailseite der
          Veranstaltung. Überschriften, Listen und Links sind möglich.
      - name: gallery
        label: Bildergalerie
        label_singular: Foto
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.imageAlt}}'
        hint: Zusätzliche Fotos, die auf der Detailseite unter dem Text als
          Galerie erscheinen.
        fields:
          - name: image
            label: Foto
            widget: image
            choose_url: false
            media_library:
              config:
                max_file_size: 5000000
            hint: Bitte vorher auf max. 2000 px Breite verkleinern.
          - name: imageAlt
            label: Bildbeschreibung (Alt-Text)
            widget: string
            required: false
            hint: Kurze Beschreibung für Screenreader.
          - name: description
            label: Bildunterschrift
            widget: text
            required: false
            hint: Erscheint in der Großansicht unter dem Foto.

  # --------------------------------------------------------------------- Tours
  - name: tours
    label: Aktivitäten
    label_singular: Tour
    description: Mountainbike-Touren und Wanderungen rund um den Hegerberg.
      Länge, Höhenmeter, Dauer und Höhenprofil werden automatisch aus der
      hochgeladenen GPX-Datei berechnet.
    folder: src/content/tours
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{type}} · {{title}}'
    sortable_fields: [type, order, title]
    view_groups:
      - label: Art
        field: type
    fields:
      - { name: title, label: Titel, widget: string }
      - name: type
        label: Art
        widget: select
        options: [Mountainbike, Wanderung]
        default: Wanderung
      - name: difficulty
        label: Schwierigkeit
        widget: select
        options: [leicht, mittel, schwer]
        default: mittel
      - name: description
        label: Kurzbeschreibung
        widget: text
        hint: Wird in der Übersicht auf der Kachel angezeigt.
      - name: gpx
        label: GPX-Datei
        widget: file
        choose_url: false
        media_folder: /public/gpx
        public_folder: /gpx
        media_library:
          config:
            max_file_size: 10000000
        hint: Aus der Datei werden Karte, Höhenprofil, Länge, Höhenmeter und
          Dauer berechnet. Die Datei muss auf .gpx enden.
      - name: start
        label: Ausgangspunkt
        widget: string
        required: false
        hint: 'Ohne Angabe wird „Schutzhaus am Hegerberg“ angezeigt.'
      - name: durationMinutes
        label: Dauer in Minuten (überschreibt die Berechnung)
        widget: number
        value_type: int
        required: false
        min: 1
        hint: Nur ausfüllen, wenn die automatisch berechnete Zeit nicht passt.
      - name: note
        label: Hinweis
        widget: string
        required: false
        hint: 'z. B. „Im Winter nicht geräumt“ oder „Forststraße gesperrt“.'
      - name: image
        label: Bild
        widget: image
        required: false
        choose_url: false
        hint: Ohne Bild wird auf der Kachel der Streckenverlauf gezeichnet.
      - name: imageAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
      - name: featured
        label: Empfohlene Tour
        widget: boolean
        default: false
      - name: order
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter vorne innerhalb der Art.
      - name: body
        label: Wegbeschreibung
        widget: markdown
        required: false
