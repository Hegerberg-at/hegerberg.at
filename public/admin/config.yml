#
# Lokale Entwicklung:
#   just                  startet Dev-Server und CMS-Proxy zusammen
#   Browser:              http://localhost:4321/admin/
# Alternativ von Hand: `bun run dev` und `bun run cms` in zwei Terminals.
# Durch `local_backend: true` wird dabei direkt ins Dateisystem geschrieben –
# ohne Git-Authentifizierung.

backend:
  name: github
  repo: Hegerberg-at/hegerberg.at
  # OAuth-Proxy auf derselben Domain (public/oauth/index.php). Nur der Login
  # läuft darüber – gespeichert wird direkt über die GitHub-API aus dem Browser.
  base_url: https://hegerberg.at
  auth_endpoint: oauth/

  branch: main
  commit_messages:
    create: 'CMS: {{collection}} „{{slug}}“ angelegt'
    update: 'CMS: {{collection}} „{{slug}}“ aktualisiert'
    delete: 'CMS: {{collection}} „{{slug}}“ gelöscht'
    uploadMedia: 'CMS: Medium {{path}} hochgeladen'
    deleteMedia: 'CMS: Medium {{path}} gelöscht'

# Lokales Backend für die Entwicklung (wird in Produktion ignoriert).
local_backend: false

locale: de
site_url: https://hegerberg.at
display_url: https://hegerberg.at

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------------------------------------------------------------- Startseite
  - name: startseite
    label: Startseite
    description: Die Texte der Willkommens-Seite. Speisen, Veranstaltungen und
      Öffnungszeiten werden aus den jeweiligen Bereichen übernommen.
    files:
      - name: index
        label: Startseite
        file: src/content/startseite/index.md
        format: yaml-frontmatter
        preview: false
        fields:
          - name: hero
            label: Titelbild-Bereich
            widget: object
            fields:
              - name: bild
                label: Titelbild
                widget: image
                required: false
                choose_url: false
                hint: Breites Querformat, mindestens 2000 px. Ohne Angabe wird das
                  Standard-Panorama verwendet.
              - name: titel
                label: Große Überschrift
                widget: string
                required: false
                hint: Ohne Angabe wird „Schutzhaus am Hegerberg“ verwendet.
              - name: untertitel
                label: Untertitel
                widget: text
                required: false
          - name: willkommen
            label: Begrüßung
            widget: object
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: titel, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: spezialitaeten
            label: 'Abschnitt „Hausspezialitäten“'
            widget: object
            hint: Welche Speisen erscheinen, wird in der Speisekarte über
              „Hausspezialität“ festgelegt.
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: titel, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: veranstaltungen
            label: 'Abschnitt „Veranstaltungen“'
            widget: object
            hint: Zeigt automatisch die drei nächsten Veranstaltungen.
            fields:
              - { name: eyebrow, label: Kleine Zeile darüber, widget: string, required: false }
              - { name: titel, label: Überschrift, widget: string }
              - name: text
                label: Text
                widget: text
                required: false
          - name: cta
            label: Abschluss-Box
            widget: object
            hint: Adresse und Telefonnummer werden automatisch ergänzt.
            fields:
              - { name: titel, label: Überschrift, widget: string }

  # ---------------------------------------------------------------- Speisekarte
  - name: speisekarte
    label: Speisekarte
    label_singular: Speise
    description: Alle Speisen und Getränke der Karte.
    folder: src/content/speisekarte
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{kategorie}} · {{name}} ({{preis}} €)'
    sortable_fields: [kategorie, reihenfolge, name, preis]
    view_groups:
      - label: Kategorie
        field: kategorie
    fields:
      - { name: name, label: Bezeichnung, widget: string }
      - name: kategorie
        label: Kategorie
        widget: select
        options: [Suppen, Vorspeisen, Hauptspeisen, Desserts, Getränke]
        default: Hauptspeisen
      - name: beschreibung
        label: Beschreibung
        widget: text
        required: false
        hint: Kurzer Beschreibungstext, der unter der Bezeichnung erscheint.
      - name: preis
        label: Preis in Euro
        widget: number
        value_type: float
        min: 0
        step: 0.1
        hint: Punkt als Dezimaltrennzeichen, z. B. 16.5
      - name: allergene
        label: Allergene
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - { label: 'A – Glutenhaltiges Getreide', value: A }
          - { label: 'B – Krebstiere', value: B }
          - { label: 'C – Eier', value: C }
          - { label: 'D – Fisch', value: D }
          - { label: 'E – Erdnüsse', value: E }
          - { label: 'F – Soja', value: F }
          - { label: 'G – Milch und Laktose', value: G }
          - { label: 'H – Schalenfrüchte (Nüsse)', value: H }
          - { label: 'L – Sellerie', value: L }
          - { label: 'M – Senf', value: M }
          - { label: 'N – Sesam', value: N }
          - { label: 'O – Sulfite', value: O }
          - { label: 'P – Lupinen', value: P }
          - { label: 'R – Weichtiere', value: R }
      - name: verfuegbar
        label: Aktuell verfügbar
        widget: boolean
        default: true
        hint: Deaktivieren, statt die Speise zu löschen – sie wird dann ausgegraut dargestellt.
      - name: hausspezialitaet
        label: Hausspezialität
        widget: boolean
        default: false
        hint: Wird zusätzlich auf der Startseite hervorgehoben.
      - name: reihenfolge
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter oben innerhalb der Kategorie.

  # ----------------------------------------------------------- Öffnungszeiten
  - name: oeffnungszeiten
    label: Öffnungszeiten
    label_singular: Wochentag
    description: Je ein Eintrag pro Wochentag. Bitte keine Tage anlegen oder löschen.
    folder: src/content/oeffnungszeiten
    create: false
    delete: false
    format: yaml-frontmatter
    identifier_field: tag
    summary: '{{reihenfolge}} · {{tag}}'
    sortable_fields: [reihenfolge]
    fields:
      - name: tag
        label: Wochentag
        widget: select
        options:
          [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag]
      - name: reihenfolge
        label: Position (Mo = 1 … So = 7)
        widget: number
        value_type: int
        min: 1
        max: 7
      - name: geschlossen
        label: Ruhetag / geschlossen
        widget: boolean
        default: false
      - name: von
        label: Geöffnet ab
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 11:00. An einem Ruhetag wird die Zeit ignoriert
          und muss nicht gelöscht werden.'
      - name: bis
        label: Geöffnet bis
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 22:00. An einem Ruhetag wird die Zeit ignoriert
          und muss nicht gelöscht werden.'
      - name: hinweis
        label: Hinweis
        widget: string
        required: false
        hint: 'z. B. „Ruhetag“ oder „Bei Schlechtwetter geschlossen“.'

  # ---------------------------------------------------------------- Geschichte
  - name: geschichte
    label: Geschichte
    label_singular: Kapitel
    description: Die Kapitel auf der Seite „Geschichte“.
    folder: src/content/geschichte
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{jahr}} · {{titel}}'
    sortable_fields: [reihenfolge, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: jahr
        label: Jahr / Zeitraum
        widget: string
        required: false
        hint: 'z. B. „1928“, „1950er“ oder „Heute“.'
      - name: beschreibung
        label: Kurzbeschreibung
        widget: text
        hint: Einleitender Satz, der als Vorspann angezeigt wird.
      - name: bild
        label: Bild
        widget: image
        required: false
        choose_url: false
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
        hint: Wichtig für Barrierefreiheit und Suchmaschinen.
      - name: reihenfolge
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
      - name: body
        label: Fließtext
        widget: markdown
        required: false

  # ------------------------------------------------------------------- Galerie
  - name: galerie
    label: Galerie
    label_singular: Foto
    description: Fotos für die Galerie-Seite. Ein Eintrag = ein Bild.
    folder: src/content/galerie
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{reihenfolge}} · {{titel}} ({{kategorie}})'
    sortable_fields: [reihenfolge, titel, kategorie]
    view_groups:
      - label: Kategorie
        field: kategorie
    fields:
      - name: titel
        label: Titel
        widget: string
        hint: Wird über dem Bild und in der Großansicht angezeigt.
      - name: bild
        label: Foto
        widget: image
        choose_url: false
        media_library:
          config:
            max_file_size: 5000000
        hint: Querformat funktioniert am besten. Bitte vorher auf max. 2000 px Breite verkleinern.
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
        hint: Kurze Beschreibung für Screenreader. Ohne Angabe wird der Titel verwendet.
      - name: beschreibung
        label: Bildunterschrift
        widget: text
        required: false
        hint: Erscheint in der Großansicht unter dem Foto.
      - name: kategorie
        label: Kategorie
        widget: select
        default: Haus & Terrasse
        options:
          - Haus & Terrasse
          - Küche
          - Aussicht
          - Veranstaltungen
      - name: hervorheben
        label: Groß darstellen
        widget: boolean
        default: false
        hint: Das Foto belegt im Raster die doppelte Fläche.
      - name: reihenfolge
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter vorne.

  # -------------------------------------------------------------------- Events
  - name: events
    label: Veranstaltungen
    label_singular: Veranstaltung
    description: Feste, Konzerte und geführte Wanderungen.
    folder: src/content/events
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    identifier_field: titel
    summary: '{{datum}} · {{titel}}'
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: datum
        label: Datum
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        format: YYYY-MM-DD
      - name: datumBis
        label: Enddatum (bei mehrtägigen Veranstaltungen)
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        format: YYYY-MM-DD
      - name: uhrzeit
        label: Beginn (Uhrzeit)
        widget: string
        required: false
        pattern:
          ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Bitte im Format HH:MM angeben']
        hint: 'Format HH:MM, z. B. 17:00'
      - name: beschreibung
        label: Kurzbeschreibung
        widget: text
        hint: Wird in der Vorschaukachel und als Vorspann auf der Detailseite angezeigt.
      - name: bild
        label: Bild
        widget: image
        required: false
        choose_url: false
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
      - name: abgesagt
        label: Abgesagt
        widget: boolean
        default: false
      - name: body
        label: Weitere Details
        widget: markdown
        required: false
        hint: Ausführlicher Text – erscheint nur auf der Detailseite der
          Veranstaltung. Überschriften, Listen und Links sind möglich.
      - name: galerie
        label: Bildergalerie
        label_singular: Foto
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.bildAlt}}'
        hint: Zusätzliche Fotos, die auf der Detailseite unter dem Text als
          Galerie erscheinen.
        fields:
          - name: bild
            label: Foto
            widget: image
            choose_url: false
            media_library:
              config:
                max_file_size: 5000000
            hint: Bitte vorher auf max. 2000 px Breite verkleinern.
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            widget: string
            required: false
            hint: Kurze Beschreibung für Screenreader.
          - name: beschreibung
            label: Bildunterschrift
            widget: text
            required: false
            hint: Erscheint in der Großansicht unter dem Foto.

  # -------------------------------------------------------------------- Touren
  - name: touren
    label: Aktivitäten
    label_singular: Tour
    description: Mountainbike-Touren und Wanderungen rund um den Hegerberg.
      Länge, Höhenmeter, Dauer und Höhenprofil werden automatisch aus der
      hochgeladenen GPX-Datei berechnet.
    folder: src/content/touren
    create: true
    delete: true
    format: yaml-frontmatter
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{art}} · {{titel}}'
    sortable_fields: [art, reihenfolge, titel]
    view_groups:
      - label: Art
        field: art
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: art
        label: Art
        widget: select
        options: [Mountainbike, Wanderung]
        default: Wanderung
      - name: schwierigkeit
        label: Schwierigkeit
        widget: select
        options: [leicht, mittel, schwer]
        default: mittel
      - name: beschreibung
        label: Kurzbeschreibung
        widget: text
        hint: Wird in der Übersicht auf der Kachel angezeigt.
      - name: gpx
        label: GPX-Datei
        widget: file
        choose_url: false
        media_folder: /public/gpx
        public_folder: /gpx
        media_library:
          config:
            max_file_size: 10000000
        hint: Aus der Datei werden Karte, Höhenprofil, Länge, Höhenmeter und
          Dauer berechnet. Die Datei muss auf .gpx enden.
      - name: start
        label: Ausgangspunkt
        widget: string
        required: false
        hint: 'Ohne Angabe wird „Schutzhaus am Hegerberg“ angezeigt.'
      - name: dauerMinuten
        label: Dauer in Minuten (überschreibt die Berechnung)
        widget: number
        value_type: int
        required: false
        min: 1
        hint: Nur ausfüllen, wenn die automatisch berechnete Zeit nicht passt.
      - name: hinweis
        label: Hinweis
        widget: string
        required: false
        hint: 'z. B. „Im Winter nicht geräumt“ oder „Forststraße gesperrt“.'
      - name: bild
        label: Bild
        widget: image
        required: false
        choose_url: false
        hint: Ohne Bild wird auf der Kachel der Streckenverlauf gezeichnet.
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        widget: string
        required: false
      - name: empfohlen
        label: Empfohlene Tour
        widget: boolean
        default: false
      - name: reihenfolge
        label: Reihenfolge
        widget: number
        value_type: int
        default: 100
        hint: Kleinere Zahl = weiter vorne innerhalb der Art.
      - name: body
        label: Wegbeschreibung
        widget: markdown
        required: false
