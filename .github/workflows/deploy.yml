#
# Deployment auf das Hostinger-Webhosting.
#
# Bei jedem Push auf main (also auch bei Änderungen über /admin/) baut der
# Runner die Seite und lädt dist/ per FTP in den Webspace. Auf dem Server
# läuft nur PHP für den OAuth-Login – die Seite selbst ist statisch.
#
# Die Upload-Action überträgt immer den kompletten Ordner und löscht auf dem
# Server nichts. Gelöschte Seiten bleiben also liegen, bis sie von Hand aus
# dem Dateimanager entfernt werden.
#
# Die Zugangsdaten liegen in der GitHub-Environment „FTP“
# (Settings → Environments → FTP → Environment secrets):
#   FTPSERVER             FTP-Host aus hPanel, z. B. ftp.hegerberg.at
#   FTPUSER               FTP-Benutzer aus hPanel
#   FTPPASSWORD           FTP-Passwort
#   OAUTH_CLIENT_ID       Client-ID der GitHub-OAuth-App
#   OAUTH_CLIENT_SECRET   Client-Secret der GitHub-OAuth-App
#   SMTP_USER             Postfach für den Formularversand, z. B.
#                         no-reply@hegerberg.at (ist zugleich der Absender)
#   SMTP_PASSWORD         Passwort dieses Postfachs
#
# Optionale Environment-Variablen (Voreinstellung in Klammern):
#   SMTP_HOST    (smtp.hostinger.com)
#   SMTP_PORT    (465)
#   SMTP_SECURE  (ssl – für Port 587 auf tls stellen)
#
# PHPMailer selbst wird nicht hier hochgeladen, sondern einmalig über den
# manuellen Workflow .github/workflows/phpmailer.yml.
#
# Wichtig: Environment-Secrets sind nur sichtbar, wenn der Job die Environment
# unten über `environment:` anfordert – sonst sind sie schlicht leer.

name: Deploy

on:
  push:
    branches: [main]
  # Erlaubt einen manuellen Deploy über die Actions-Oberfläche.
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig; ein neuerer Push wartet auf den laufenden.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Bauen und hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: FTP

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Ohne bun.lock im Repo kann hier nicht gegen einen festen Stand
      # installiert werden – die Versionen ergeben sich aus package.json.
      - name: Abhängigkeiten installieren
        run: bun install

      - name: Seite bauen
        run: bun run build

      - name: OAuth-Zugangsdaten erzeugen
        env:
          CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${CLIENT_ID:?Secret OAUTH_CLIENT_ID fehlt in der Environment FTP}"
          : "${CLIENT_SECRET:?Secret OAUTH_CLIENT_SECRET fehlt in der Environment FTP}"

          # Für einfach gequotete PHP-Strings müssen nur \ und ' maskiert
          # werden. Die Werte werden dabei nie ausgegeben.
          id=${CLIENT_ID//\\/\\\\}; id=${id//\'/\\\'}
          secret=${CLIENT_SECRET//\\/\\\\}; secret=${secret//\'/\\\'}

          cat > dist/oauth/config.php <<EOF
          <?php
          // Wird bei jedem Deploy aus den GitHub-Secrets erzeugt – nicht von
          // Hand bearbeiten.
          return [
              'client_id' => '${id}',
              'client_secret' => '${secret}',
          ];
          EOF

          # Syntaxprüfung, falls der Runner PHP mitbringt – sonst nur ein Hinweis.
          if command -v php >/dev/null; then
            php -l dist/oauth/config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

          # Die Vorlage ist reine Dokumentation und hat auf dem Server nichts
          # verloren; die Upload-Action kennt keine Ausschlussliste.
          rm -f dist/oauth/config.example.php

      - name: SMTP-Zugangsdaten erzeugen
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
        run: |
          set -euo pipefail
          : "${SMTP_USER:?Secret SMTP_USER fehlt in der Environment FTP}"
          : "${SMTP_PASSWORD:?Secret SMTP_PASSWORD fehlt in der Environment FTP}"

          # Ohne gesetzte Variablen die Hostinger-Standardwerte.
          host=${SMTP_HOST:-smtp.hostinger.com}
          port=${SMTP_PORT:-465}
          secure=${SMTP_SECURE:-ssl}

          # Für einfach gequotete PHP-Strings müssen nur \ und ' maskiert
          # werden. Die Werte werden dabei nie ausgegeben.
          maskieren() { local w=${1//\\/\\\\}; printf '%s' "${w//\'/\\\'}"; }
          benutzer=$(maskieren "$SMTP_USER")
          absender=$(maskieren "$SMTP_FROM")
          passwort=$(maskieren "$SMTP_PASSWORD")
          host=$(maskieren "$host")

          cat > dist/api/config.php <<EOF
          <?php
          // Wird bei jedem Deploy aus den GitHub-Secrets erzeugt – nicht von
          // Hand bearbeiten.
          return [
              'host' => '${host}',
              'port' => ${port},
              'verschluesselung' => '${secure}',
              'benutzer' => '${benutzer}',
              'passwort' => '${passwort}',
              'absender' => '${absender}',
              'absender_name' => 'Schutzhaus am Hegerberg',
              'empfaenger' => 'office@hegerberg.at',
          ];
          EOF

          if command -v php >/dev/null; then
            php -l dist/api/config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

          rm -f dist/api/config.example.php

      # Docker-Action – dadurch unabhängig von der Node-Version des Runners.
      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTPSERVER }}
          username: ${{ vars.FTPUSER }}
          password: ${{ secrets.FTPPASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/hegerberg.at/public_html/
          # Die Action merkt sich den letzten Stand in dieser Datei und
          # überträgt beim nächsten Mal nur die Unterschiede.
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            oauth/config.example.php
            api/config.example.php
            # PHPMailer kommt aus dem Workflow „PHPMailer hochladen“.
            vendor/**