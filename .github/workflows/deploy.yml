#
# Deployment auf das Hostinger-Webhosting.
#
# Bei jedem Push auf main (also auch bei Änderungen über /admin/) baut der
# Runner die Seite und lädt dist/ per FTP in den Webspace. Auf dem Server
# läuft nur PHP für den OAuth-Login – die Seite selbst ist statisch.
#
# Die Upload-Action überträgt immer den kompletten Ordner und löscht auf dem
# Server nichts. Gelöschte Seiten bleiben also liegen, bis sie von Hand aus
# dem Dateimanager entfernt werden.
#
# Die Zugangsdaten liegen in der GitHub-Environment „FTP“
# (Settings → Environments → FTP → Environment secrets):
#   FTPSERVER             FTP-Host aus hPanel, z. B. ftp.hegerberg.at
#   FTPUSER               FTP-Benutzer aus hPanel
#   FTPPASSWORD           FTP-Passwort
#   OAUTH_CLIENT_ID       Client-ID der GitHub-OAuth-App
#   OAUTH_CLIENT_SECRET   Client-Secret der GitHub-OAuth-App
#
# Wichtig: Environment-Secrets sind nur sichtbar, wenn der Job die Environment
# unten über `environment:` anfordert – sonst sind sie schlicht leer.

name: Deploy

on:
  push:
    branches: [main]
  # Erlaubt einen manuellen Deploy über die Actions-Oberfläche.
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig; ein neuerer Push wartet auf den laufenden.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Bauen und hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: FTP

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Ohne bun.lock im Repo kann hier nicht gegen einen festen Stand
      # installiert werden – die Versionen ergeben sich aus package.json.
      - name: Abhängigkeiten installieren
        run: bun install

      - name: Seite bauen
        run: bun run build

      - name: OAuth-Zugangsdaten erzeugen
        env:
          CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${CLIENT_ID:?Secret OAUTH_CLIENT_ID fehlt in der Environment FTP}"
          : "${CLIENT_SECRET:?Secret OAUTH_CLIENT_SECRET fehlt in der Environment FTP}"

          # Für einfach gequotete PHP-Strings müssen nur \ und ' maskiert
          # werden. Die Werte werden dabei nie ausgegeben.
          id=${CLIENT_ID//\\/\\\\}; id=${id//\'/\\\'}
          secret=${CLIENT_SECRET//\\/\\\\}; secret=${secret//\'/\\\'}

          cat > dist/oauth/config.php <<EOF
          <?php
          // Wird bei jedem Deploy aus den GitHub-Secrets erzeugt – nicht von
          // Hand bearbeiten.
          return [
              'client_id' => '${id}',
              'client_secret' => '${secret}',
          ];
          EOF

          # Syntaxprüfung, falls der Runner PHP mitbringt – sonst nur ein Hinweis.
          if command -v php >/dev/null; then
            php -l dist/oauth/config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

          # Die Vorlage ist reine Dokumentation und hat auf dem Server nichts
          # verloren; die Upload-Action kennt keine Ausschlussliste.
          rm -f dist/oauth/config.example.php

      # Docker-Action – dadurch unabhängig von der Node-Version des Runners.
      - name: Per FTP hochladen
        uses: dennisameling/ftp-upload-action@v2
        with:
          server: ${{ secrets.FTPSERVER }}
          username: ${{ secrets.FTPUSER }}
          password: ${{ secrets.FTPPASSWORD }}
          local_dir: dist/
          server_dir: public_html/
          secure: false
