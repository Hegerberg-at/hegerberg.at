#
# Deployment to the Hostinger web hosting.
#
# On every push to main (so also on changes made through /admin/) the runner
# builds the site and uploads dist/ via FTP to the web space. Only PHP for the
# OAuth login runs on the server – the site itself is static.
#
# The upload action always transfers the whole folder and deletes nothing on
# the server. Removed pages therefore stay around until they are deleted by
# hand from the file manager.
#
# The credentials live in the GitHub environment „FTP“
# (Settings → Environments → FTP → Environment secrets):
#   FTPSERVER             FTP host from the hPanel, e.g. ftp.hegerberg.at
#   FTPUSER               FTP user from the hPanel
#   FTPPASSWORD           FTP password
#   OAUTH_CLIENT_ID       client ID of the GitHub OAuth app
#   OAUTH_CLIENT_SECRET   client secret of the GitHub OAuth app
#   SMTP_USER             mailbox used for sending the form, e.g.
#                         no-reply@hegerberg.at (also the sender)
#   SMTP_PASSWORD         password of that mailbox
#   VAPID_PUBLIC_KEY      public VAPID key of the push messages
#   VAPID_PRIVATE_KEY     private VAPID key
#   PUSH_VERSAND_TOKEN    shared secret between the notify workflow and
#                         api/push-send.php
#
# Optional environment variables (default in brackets):
#   SMTP_HOST      (smtp.hostinger.com)
#   SMTP_PORT      (465)
#   SMTP_SECURE    (ssl – set to tls for port 587)
#   VAPID_SUBJECT  (mailto:office@hegerberg.at)
#
# If the three push values are missing, the deploy still succeeds – only the
# notifications stay switched off.
#
# PHPMailer and web-push are not uploaded here but once through the manual
# workflow .github/workflows/php-libraries.yml.
#
# Important: environment secrets are only visible when the job requests the
# environment through `environment:` below – otherwise they are simply empty.

name: Deploy

on:
  push:
    branches: [main]
  # Allows a manual deploy through the Actions UI.
  workflow_dispatch:

# Never two deployments at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: FTP

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Without a bun.lock in the repository this cannot install against a
      # pinned state – the versions follow from package.json.
      - name: Install dependencies
        run: bun install

      - name: Build the site
        run: bun run build

      - name: Generate OAuth credentials
        env:
          CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${CLIENT_ID:?Secret OAUTH_CLIENT_ID fehlt in der Environment FTP}"
          : "${CLIENT_SECRET:?Secret OAUTH_CLIENT_SECRET fehlt in der Environment FTP}"

          # For single-quoted PHP strings only \ and ' have to be escaped. The
          # values are never printed in the process.
          id=${CLIENT_ID//\\/\\\\}; id=${id//\'/\\\'}
          secret=${CLIENT_SECRET//\\/\\\\}; secret=${secret//\'/\\\'}

          cat > dist/oauth/config.php <<EOF
          <?php
          // Generated from the GitHub secrets on every deploy – do not edit by
          // hand.
          return [
              'client_id' => '${id}',
              'client_secret' => '${secret}',
          ];
          EOF

          # Syntax check in case the runner ships PHP – otherwise just a note.
          if command -v php >/dev/null; then
            php -l dist/oauth/config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

          # The template is pure documentation and has no business on the
          # server; the upload action has no exclusion list of its own.
          rm -f dist/oauth/config.example.php

      - name: Generate SMTP credentials
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
        run: |
          set -euo pipefail
          : "${SMTP_USER:?Secret SMTP_USER fehlt in der Environment FTP}"
          : "${SMTP_PASSWORD:?Secret SMTP_PASSWORD fehlt in der Environment FTP}"

          # The Hostinger defaults when the variables are not set.
          host=${SMTP_HOST:-smtp.hostinger.com}
          port=${SMTP_PORT:-465}
          secure=${SMTP_SECURE:-ssl}

          # For single-quoted PHP strings only \ and ' have to be escaped. The
          # values are never printed in the process.
          escape() { local v=${1//\\/\\\\}; printf '%s' "${v//\'/\\\'}"; }
          username=$(escape "$SMTP_USER")
          from=$(escape "$SMTP_FROM")
          password=$(escape "$SMTP_PASSWORD")
          host=$(escape "$host")

          cat > dist/api/config.php <<EOF
          <?php
          // Generated from the GitHub secrets on every deploy – do not edit by
          // hand.
          return [
              'host' => '${host}',
              'port' => ${port},
              'encryption' => '${secure}',
              'username' => '${username}',
              'password' => '${password}',
              'from' => '${from}',
              'from_name' => 'Schutzhaus am Hegerberg',
              'recipient' => 'office@hegerberg.at',
          ];
          EOF

          if command -v php >/dev/null; then
            php -l dist/api/config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

          rm -f dist/api/config.example.php

      - name: Generate push credentials
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # The secret keeps its name in the GitHub settings.
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_VERSAND_TOKEN }}
        run: |
          set -euo pipefail

          # The template is pure documentation and has no business on the
          # server – regardless of whether the keys are set.
          rm -f dist/api/push-config.example.php

          # As long as the keys are not configured the deploy still stays
          # green: without push-config.php only the notifications are off, the
          # site itself works completely.
          if [ -z "${VAPID_PUBLIC_KEY:-}" ] || [ -z "${VAPID_PRIVATE_KEY:-}" ] || [ -z "${PUSH_SEND_TOKEN:-}" ]; then
            echo "::warning::VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY oder PUSH_VERSAND_TOKEN fehlt in der Environment FTP – Push-Benachrichtigungen bleiben aus. Siehe README, Abschnitt „Push-Benachrichtigungen“."
            exit 0
          fi

          subject=${VAPID_SUBJECT:-mailto:office@hegerberg.at}

          # For single-quoted PHP strings only \ and ' have to be escaped. The
          # values are never printed in the process.
          escape() { local v=${1//\\/\\\\}; printf '%s' "${v//\'/\\\'}"; }
          public=$(escape "$VAPID_PUBLIC_KEY")
          private=$(escape "$VAPID_PRIVATE_KEY")
          subject=$(escape "$subject")
          token=$(escape "$PUSH_SEND_TOKEN")

          cat > dist/api/push-config.php <<EOF
          <?php
          // Generated from the GitHub secrets on every deploy – do not edit by
          // hand.
          return [
              'vapid_public' => '${public}',
              'vapid_private' => '${private}',
              'vapid_subject' => '${subject}',
              'send_token' => '${token}',
              // Sits one level above public_html and is therefore not
              // reachable through the browser. The directory name is kept as
              // it is – it holds the live subscriptions.
              'data_dir' => __DIR__ . '/../../push-daten',
          ];
          EOF

          if command -v php >/dev/null; then
            php -l dist/api/push-config.php
          else
            echo "PHP auf dem Runner nicht verfügbar – Syntaxprüfung übersprungen."
          fi

      # Docker action – therefore independent of the runner's Node version.
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTPSERVER }}
          username: ${{ vars.FTPUSER }}
          password: ${{ secrets.FTPPASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/hegerberg.at/public_html/
          # The action remembers the last state in this file and only transfers
          # the differences next time.
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            oauth/config.example.php
            api/config.example.php
            api/push-config.example.php
            # PHPMailer and web-push come from the workflow
            # „Upload PHP libraries“.
            vendor/**
