#
# Push-Benachrichtigung bei neuen Veranstaltungen.
#
# Läuft automatisch, sobald der Deploy-Workflow erfolgreich durch ist – also
# erst, wenn die neue Veranstaltung auch wirklich auf der Website steht. Wer
# auf die Benachrichtigung tippt, soll schließlich nicht ins Leere laufen.
#
# Gemeldet werden nur Dateien, die im ausgelösten Commit neu unter
# src/content/events/ dazugekommen sind (git diff --diff-filter=A). Änderungen
# an bestehenden Veranstaltungen lösen nichts aus. Zusätzlich merkt sich
# api/push-versand.php jeden bereits versendeten Slug, damit auch ein von Hand
# wiederholter Deploy keine zweite Nachricht auslöst.
#
# Zugangsdaten aus der GitHub-Environment „FTP“ (wie beim Deploy):
#   PUSH_VERSAND_TOKEN  Geheimnis, das api/push-versand.php erwartet (Secret)
#
# Optionale Environment-Variable:
#   PUSH_ENDPUNKT  (https://hegerberg.at/api/push-versand.php)

name: Veranstaltung melden

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

# Zwei Läufe gleichzeitig könnten dieselbe Veranstaltung doppelt melden.
concurrency:
  group: veranstaltung-melden
  cancel-in-progress: false

jobs:
  melden:
    name: Neue Veranstaltungen benachrichtigen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: FTP

    # Nur nach einem geglückten Deploy von main. Ein von Hand gestarteter
    # Deploy (workflow_dispatch) hat keinen neuen Commit im Gepäck – dort gibt
    # es nichts zu melden.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v7
        with:
          # Der Stand, der gerade deployt wurde – nicht der aktuelle Kopf von
          # main, der inzwischen weitergelaufen sein kann.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Für den Vergleich mit dem Vorgänger-Commit.
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: bun install

      - name: Neue Veranstaltungen ermitteln
        id: neu
        run: |
          set -euo pipefail

          # Das CMS schreibt pro Änderung genau einen Commit, darum reicht der
          # Vergleich mit dem direkten Vorgänger.
          dateien=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- 'src/content/events/*.md' || true)

          if [ -z "$dateien" ]; then
            echo "Keine neue Veranstaltung in $(git rev-parse --short HEAD)."
          else
            echo "Neu:"; echo "$dateien"
          fi

          {
            echo 'dateien<<ENDE'
            echo "$dateien"
            echo 'ENDE'
          } >> "$GITHUB_OUTPUT"

      - name: Benachrichtigung versenden
        if: steps.neu.outputs.dateien != ''
        env:
          PUSH_VERSAND_TOKEN: ${{ secrets.PUSH_VERSAND_TOKEN }}
          PUSH_ENDPUNKT: ${{ vars.PUSH_ENDPUNKT }}
          DATEIEN: ${{ steps.neu.outputs.dateien }}
        run: |
          set -euo pipefail
          # Wortweise Aufspaltung ist hier gewollt: eine Datei pro Zeile.
          # shellcheck disable=SC2086
          bun run scripts/veranstaltung-melden.mjs $DATEIEN
